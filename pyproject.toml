[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-model-buddy"
version = "0.1.0"
description = "A friendly hardware-aware guide to choosing and running local AI models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Local Model Buddy contributors" }]
dependencies = [
  "httpx>=0.27",
  "psutil>=5.9",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
lmb = "lmb.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lmb"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["lmb"]
